# Publicação das imagens Fala42 (fork Tech42) no GHCR — app e worker apenas.
# NÃO substitui publish-image.yml (imagens genéricas melgarafael/DeskcommCRM).
# Só dispara neste branch base de produção Fala42 ou manualmente.

name: Fala42 — publicar imagens no GHCR

on:
  push:
    branches:
      - base/prod-1.111.0
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: jorgecavalcant

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fala42-app
            dockerfile: Dockerfile
            cache_scope: fala42-app-amd64
          - image: fala42-worker
            dockerfile: Dockerfile.worker
            cache_scope: fala42-worker-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versão embutida na imagem
        id: ver
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=prod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}